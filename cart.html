<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Корзина — Дами</title>
  <link rel="stylesheet" href="style.css?v=6">
  <style>
    .cart-page {
      max-width: 700px;
      margin: 48px auto;
      padding: 0 24px;
    }
    .cart-empty {
      text-align: center;
      padding: 80px 0;
      color: var(--muted);
      font-size: 18px;
    }
    .cart-empty a {
      display: inline-block;
      margin-top: 20px;
      color: var(--green);
      text-decoration: underline;
    }
    .cart-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 0;
      border-bottom: 1px solid var(--border);
    }
    .cart-item-qty {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .qty-btn {
      width: 28px;
      height: 28px;
      border: 1.5px solid var(--green);
      border-radius: 50%;
      background: none;
      color: var(--green);
      font-size: 17px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.18s, color 0.18s;
    }
    .qty-btn:hover { background: var(--green); color: #fff; }
    .qty-val {
      font-size: 16px;
      font-weight: 600;
      min-width: 22px;
      text-align: center;
      color: var(--text);
    }
    .cart-item-img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 10px;
      background: linear-gradient(135deg, #dff0e6, #ede5d5);
      flex-shrink: 0;
    }
    .cart-item-img-ph {
      width: 80px;
      height: 80px;
      border-radius: 10px;
      background: linear-gradient(135deg, #dff0e6, #ede5d5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      flex-shrink: 0;
    }
    .cart-item-info { flex: 1; }
    .cart-item-name {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
    }
    .cart-item-sub {
      font-size: 13px;
      color: var(--muted);
    }
    .cart-cat-label {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .cart-item-weight {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }
    .cart-item-remove {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-size: 20px;
      padding: 4px 8px;
      border-radius: 6px;
      transition: color 0.18s, background 0.18s;
    }
    .cart-item-remove:hover { color: #c0392b; background: #fff0ee; }
    .cart-actions {
      margin-top: 32px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-cart-order {
      display: block;
      width: 100%;
      padding: 16px;
      background: var(--green);
      color: white;
      border: none;
      border-radius: 10px;
      text-align: center;
      font-family: 'Raleway', sans-serif;
      font-size: 16px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: background 0.18s;
    }
    .btn-cart-order:hover { background: var(--green2); }
    .btn-cart-share {
      display: block;
      width: 100%;
      padding: 12px;
      background: none;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 10px;
      text-align: center;
      font-family: 'Raleway', sans-serif;
      font-size: 14px;
      cursor: pointer;
      transition: border-color 0.18s, color 0.18s;
    }
    .btn-cart-share:hover { border-color: #8b2252; color: #8b2252; }
    .btn-cart-clear {
      display: block;
      width: 100%;
      padding: 12px;
      background: none;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 10px;
      text-align: center;
      font-family: 'Raleway', sans-serif;
      font-size: 14px;
      cursor: pointer;
      transition: border-color 0.18s, color 0.18s;
    }
    .btn-cart-clear:hover { border-color: #8b2252; color: #8b2252; }
    .cart-title {
      font-family: 'Marck Script', cursive;
      font-size: 42px;
      font-weight: 400;
      color: var(--text);
      margin-bottom: 8px;
      text-align: center;
    }
    .cart-count-label {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 24px;
    }
  </style>
</head>
<body>

  <div class="cart-page">
    <div class="cart-title">Корзина</div>
    <div class="cart-count-label" id="cart-count-label"></div>
    <div id="cart-list"></div>
  </div>

  <script src="products.js?v=2"></script>
  <script src="nav.js?v=2"></script>
  <script>
    function getCart() {
      return JSON.parse(localStorage.getItem('dami_cart') || '[]');
    }
    function saveCart(cart) {
      localStorage.setItem('dami_cart', JSON.stringify(cart));
      if (window.updateCartCount) window.updateCartCount();
    }
    function changeQty(id, delta) {
      const cart = getCart();
      const item = cart.find(i => i.id === id);
      if (!item) return;
      item.qty = (item.qty || 1) + delta;
      if (item.qty <= 0) saveCart(cart.filter(i => i.id !== id));
      else saveCart(cart);
      renderCart();
    }
    function removeItem(id) {
      saveCart(getCart().filter(i => i.id !== id));
      renderCart();
    }
    function clearCart() {
      saveCart([]);
      renderCart();
    }

    function sendCart(type) {
      const cart = getCart();
      if (!cart.length) return;
      const lines = cart.map(item => {
        const _sr2 = /^(всех|сухой|жирной|комбинированной|нормальной|чувствительной)/i;
        const _di2 = item.name.indexOf(' для ');
        const main = (_di2 !== -1 && _sr2.test(item.name.slice(_di2 + 5))) ? item.name.slice(0, _di2) : item.name;
        const qty = item.qty || 1;
        const p = PRODUCTS.find(x => x.id === item.id);
        const weight = p && p.weight ? `, ${p.weight}` : '';
        const catPrefix = p && p.category === 'soap' ? 'Мыло ' : '';
        return `- ${catPrefix}${main} × ${qty} шт${weight}`;
      }).join('\n');
      const msg = 'Мой список:\n' + lines;
      const urls = {
        tg:  'https://t.me/EmiliyaT?text='    + encodeURIComponent(msg),
        wa:  'https://wa.me/79646418016?text=' + encodeURIComponent(msg),
        max: 'https://max.ru/u/f9LHodD0cOJED4Pjd_kQjh36VllBLFJ6e9O1iuunwgQ6yELzlDR-bTbPFfg'
      };
      window.open(urls[type], '_blank');
    }

    function renderCart() {
      const cart  = getCart();
      const list  = document.getElementById('cart-list');
      const label = document.getElementById('cart-count-label');

      if (!cart.length) {
        label.textContent = '';
        list.innerHTML = `
          <div class="cart-empty">
            Корзина пуста
            <br><a href="soap.html">Перейти в каталог</a>
          </div>`;
        return;
      }

      const total = cart.reduce((s, i) => s + (i.qty || 1), 0);
      label.textContent = noun(total, 'товар', 'товара', 'товаров');

      list.innerHTML = cart.map(item => {
        const p = PRODUCTS.find(x => x.id === item.id);
        const imgHtml = p && p.image
          ? `<img class="cart-item-img" src="${p.image}" alt="" onerror="this.outerHTML='<div class=\\'cart-item-img-ph\\'>🌿</div>'">`
          : `<div class="cart-item-img-ph">🌿</div>`;
        const _sr = /^(всех|сухой|жирной|комбинированной|нормальной|чувствительной)/i;
        const _di = item.name.indexOf(' для ');
        const _sk = _di !== -1 && _sr.test(item.name.slice(_di + 5));
        const mainName = _sk ? item.name.slice(0, _di) : item.name;
        const sub      = _sk ? item.name.slice(_di + 1) : '';
        const qty = item.qty || 1;
        const catLabel = p && p.category === 'soap' ? '<div class="cart-cat-label">Мыло</div>' : '';
        const weightHtml = p && p.weight ? `<div class="cart-item-weight">${p.weight}</div>` : '';
        return `
          <div class="cart-item">
            ${imgHtml}
            <div class="cart-item-info">
              ${catLabel}
              <div class="cart-item-name">${mainName}</div>
              ${sub ? `<div class="cart-item-sub">${sub}</div>` : ''}
              ${weightHtml}
            </div>
            <div class="cart-item-qty">
              <button class="qty-btn" onclick="changeQty(${item.id}, -1)">−</button>
              <span class="qty-val">${qty}</span>
              <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
            </div>
            <button class="cart-item-remove" onclick="removeItem(${item.id})" title="Удалить">✕</button>
          </div>`;
      }).join('');

      list.innerHTML += `
        <div class="cart-actions">
          <div class="contact-menu">
            <button class="btn-cart-order" onclick="toggleContactMenu(this)">Задать вопрос</button>
            <div class="contact-dropdown">
              <a href="https://t.me/EmiliyaT" target="_blank">Telegram</a>
              <a href="https://max.ru/u/f9LHodD0cOJED4Pjd_kQjh36VllBLFJ6e9O1iuunwgQ6yELzlDR-bTbPFfg" target="_blank">MAX</a>
            </div>
          </div>
          <div class="contact-menu">
            <button class="btn-cart-order btn-cart-send" onclick="toggleContactMenu(this)">Отправить</button>
            <div class="contact-dropdown">
              <a href="#" onclick="event.preventDefault(); sendCart('tg')">Telegram</a>
              <a href="#" onclick="event.preventDefault(); sendCart('max')">MAX</a>
            </div>
          </div>
          <button id="btn-share" class="btn-cart-share" onclick="shareCart()">Поделиться корзиной</button>
          <button class="btn-cart-clear" onclick="clearCart()">Очистить корзину</button>
        </div>`;
    }

    function noun(n, one, few, many) {
      const mod10 = n % 10, mod100 = n % 100;
      if (mod10 === 1 && mod100 !== 11) return `${n} ${one}`;
      if ([2,3,4].includes(mod10) && ![12,13,14].includes(mod100)) return `${n} ${few}`;
      return `${n} ${many}`;
    }

    function shareCart() {
      const cart = getCart();
      if (!cart.length) return;
      const slim = cart.map(i => [i.id, i.qty || 1]);
      const url = location.origin + location.pathname + '?cart=' + encodeURIComponent(JSON.stringify(slim));
      navigator.clipboard.writeText(url).then(() => {
        const btn = document.getElementById('btn-share');
        const orig = btn.textContent;
        btn.textContent = 'Ссылка скопирована ✓';
        setTimeout(() => { btn.textContent = orig; }, 2500);
      }).catch(() => {
        prompt('Скопируй ссылку:', url);
      });
    }

    // Import cart from URL if ?cart= param present
    (function() {
      const param = new URLSearchParams(location.search).get('cart');
      if (!param) return;
      try {
        const slim = JSON.parse(decodeURIComponent(param));
        const imported = slim.map(([id, qty]) => {
          const p = PRODUCTS.find(x => x.id === id);
          return p ? { id, name: p.name, qty } : null;
        }).filter(Boolean);
        if (imported.length) saveCart(imported);
      } catch(e) {}
      history.replaceState(null, '', location.pathname);
    })();

    renderCart();
  </script>
</body>
</html>
