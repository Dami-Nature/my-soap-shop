<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Наборы — Дами</title>
  <link rel="stylesheet" href="style.css?v=54">
  <style>
    .sets-gallery {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      max-width: 900px;
      margin: 0 auto 36px;
    }
    .sets-gallery-img, .sets-gallery-ph {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 12px;
      display: block;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    }
    .sets-gallery-ph {
      background: linear-gradient(135deg, #dff0e6, #ede5d5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }
    @media (max-width: 600px) {
      .sets-gallery { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <div class="page-hero">
    <a href="index.html#catalog" class="page-hero-back">← Каталог</a>
    <div class="page-hero-title">Наборы</div>
    <div class="page-hero-sub">Наборы могут быть уже собраны или можно собрать под запрос.</div>
  </div>

  <section class="section">
    <div class="sets-gallery" id="sets-gallery" style="display:none"></div>
    <div class="products-grid" id="products-grid"></div>
  </section>

  <script src="config.js?v=2"></script>
  <script>document.write('<script src="products.js?v=' + Date.now() + '"><\/script>')</script>
  <script src="nav.js?v=5"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
