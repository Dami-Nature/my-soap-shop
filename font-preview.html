<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Превью шрифтов</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Pacifico&family=Dancing+Script:wght@700&family=Great+Vibes&family=Satisfy&family=Sacramento&family=Cookie&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f5e2cc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: 40px 20px;
    }
    .row {
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 700px;
      padding: 22px 32px;
      border-bottom: 1px solid rgba(74,124,89,0.15);
      gap: 28px;
    }
    .row:last-child { border-bottom: none; }
    .label {
      width: 180px;
      flex-shrink: 0;
      font-family: 'Raleway', Arial, sans-serif;
      font-size: 13px;
      letter-spacing: 1px;
      color: #888;
      text-transform: uppercase;
    }
    .current-badge {
      font-size: 10px;
      background: #4a7c59;
      color: #fff;
      border-radius: 4px;
      padding: 2px 6px;
      margin-left: 6px;
      letter-spacing: 0;
      text-transform: none;
      vertical-align: middle;
    }
    .preview {
      font-size: 52px;
      color: #1a0a02;
      line-height: 1.1;
    }
    .f1 { font-family: 'Marck Script', cursive; }
    .f2 { font-family: 'Pacifico', cursive; }
    .f3 { font-family: 'Dancing Script', cursive; font-weight: 700; }
    .f4 { font-family: 'Great Vibes', cursive; font-size: 64px; }
    .f5 { font-family: 'Satisfy', cursive; }
    .f6 { font-family: 'Sacramento', cursive; font-size: 64px; }
    .f7 { font-family: 'Cookie', cursive; }
  </style>
</head>
<body>

  <div class="row">
    <div class="label">Marck Script <span class="current-badge">текущий</span></div>
    <div class="preview f1">Косметика</div>
  </div>
  <div class="row">
    <div class="label">Pacifico</div>
    <div class="preview f2">Косметика</div>
  </div>
  <div class="row">
    <div class="label">Dancing Script</div>
    <div class="preview f3">Косметика</div>
  </div>
  <div class="row">
    <div class="label">Great Vibes</div>
    <div class="preview f4">Косметика</div>
  </div>
  <div class="row">
    <div class="label">Satisfy</div>
    <div class="preview f5">Косметика</div>
  </div>
  <div class="row">
    <div class="label">Sacramento</div>
    <div class="preview f6">Косметика</div>
  </div>
  <div class="row">
    <div class="label">Cookie</div>
    <div class="preview f7">Косметика</div>
  </div>

</body>
</html>
