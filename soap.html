<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мыло — Дами</title>
  <link rel="stylesheet" href="style.css?v=6">
  <style>
    .section-label {
      font-family: 'Raleway', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #1a0a02;
      margin-bottom: 20px;
      margin-top: 40px;
      max-width: 1100px;
      margin-left: auto;
      margin-right: auto;
    }
    #soap-groups .section-label:first-child { margin-top: 0; }
    #soap-groups .products-grid { margin-bottom: 0; }
  </style>
</head>
<body>

  <div class="page-hero">
    <a href="index.html#catalog" class="page-hero-back">← Каталог</a>
    <div class="page-hero-title">Мыло</div>
    <div class="page-hero-sub">Натуральное мыло ручной работы из природных и растительных ингредиентов: масла, травы, глины, шоколад, пряности, водоросли, смолы, эфирные масла и т.д. Без парфюмированных отдушек, красителей, ПАВов.</div>
  </div>

  <section class="section">

    <div id="soap-groups"></div>

  </section>

  <script src="products.js?v=3"></script>
  <script src="nav.js?v=5"></script>
  <script src="app.js?v=3"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const wrap = document.getElementById('soap-groups');
      const groups = [
        { sub: 'all',       label: 'Для всех типов кожи' },
        { sub: 'dry',       label: 'Для сухой кожи' },
        { sub: 'cleansing', label: 'Очищающее' },
        { sub: 'children',  label: 'Детское мыло' },
        { sub: 'archive',   label: 'Прошлые коллекции' },
      ];
      groups.forEach(function(g) {
        const items = PRODUCTS.filter(function(p) { return p.category === 'soap' && p.subcategory === g.sub; });
        if (!items.length) return;
        const label = document.createElement('div');
        label.className = 'section-label';
        label.textContent = g.label;
        const grid = document.createElement('div');
        grid.className = 'products-grid';
        renderGrid(grid, items);
        wrap.appendChild(label);
        wrap.appendChild(grid);
      });
    });
  </script>
</body>
</html>
