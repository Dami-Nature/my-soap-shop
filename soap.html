<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Мыло — Дами</title>
  <link rel="stylesheet" href="style.css?v=54">
  <style>
    .section-label {
      font-family: 'Raleway', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #1a0a02;
      margin-bottom: 20px;
      margin-top: 40px;
      max-width: 1100px;
      margin-left: auto;
      margin-right: auto;
    }
    #soap-groups .section-label:first-child { margin-top: 0; }
    #soap-groups .products-grid { margin-bottom: 0; }
  </style>
</head>
<body>

  <div class="page-hero">
    <a href="index.html#catalog" class="page-hero-back">← Каталог</a>
    <div class="page-hero-title">Мыло</div>
    <div class="page-hero-sub">Натуральное мыло ручной работы из природных и растительных ингредиентов: масла, травы, глины, шоколад, пряности, водоросли, смолы, эфирные масла и т.д. Без парфюмированных отдушек, красителей, ПАВов.</div>
  </div>

  <section class="section">

    <div class="filter-bar">
      <button class="filter-tab active" data-sub="" onclick="selectSub(this)">Всё</button>
      <button class="filter-tab" data-sub="all" onclick="selectSub(this)">Для всех типов кожи</button>
      <button class="filter-tab" data-sub="dry" onclick="selectSub(this)">Для сухой</button>
      <button class="filter-tab" data-sub="cleansing" onclick="selectSub(this)">Очищающее</button>
      <button class="filter-tab" data-sub="children" onclick="selectSub(this)">Детское</button>
      <button class="filter-tab" data-sub="archive" onclick="selectSub(this)">Прошлые коллекции</button>
    </div>

    <div id="soap-groups"></div>

  </section>

  <script>document.write('<script src="products.js?v=' + Date.now() + '"><\/script>')</script>
  <script src="nav.js?v=6"></script>
  <script src="app.js?v=5"></script>
  <script>
    var _activeSub = '';

    var GROUPS = [
      { subs: ['all'],               label: 'Для всех типов кожи' },
      { subs: ['dry', 'children'],   label: 'Для сухой кожи' },
      { subs: ['cleansing'],         label: 'Очищающее' },
      { subs: ['archive'],           label: 'Прошлые коллекции' },
    ];

    // Товары, которые дополнительно показываются ещё в одной подкатегории,
    // помимо своей основной (products.js хранит только одну subcategory)
    var EXTRA_SUBS = { 8: ['all'] }; // Мыло-скраб кофейное: очищающее + для всех типов кожи

    function productInSubs(p, subs) {
      if (subs.indexOf(p.subcategory) !== -1) return true;
      var extra = EXTRA_SUBS[p.id] || [];
      return extra.some(function(s) { return subs.indexOf(s) !== -1; });
    }

    function selectSub(el) {
      _activeSub = el.dataset.sub;
      document.querySelectorAll('.filter-tab').forEach(function(t) {
        t.classList.toggle('active', t.dataset.sub === _activeSub);
      });
      renderSoap();
    }

    function renderSoap() {
      var wrap = document.getElementById('soap-groups');
      wrap.innerHTML = '';
      if (_activeSub === '') {
        // Show all grouped
        GROUPS.forEach(function(g) {
          var items = PRODUCTS.filter(function(p) { return p.category === 'soap' && productInSubs(p, g.subs); });
          if (!items.length) return;
          var label = document.createElement('div');
          label.className = 'section-label';
          label.textContent = g.label;
          var grid = document.createElement('div');
          grid.className = 'products-grid';
          renderGrid(grid, items);
          wrap.appendChild(label);
          wrap.appendChild(grid);
        });
      } else {
        // Show single subcategory flat (детское дублируется и в "для сухой")
        var subs = _activeSub === 'dry' ? ['dry', 'children'] : [_activeSub];
        var items = PRODUCTS.filter(function(p) { return p.category === 'soap' && productInSubs(p, subs); });
        var grid = document.createElement('div');
        grid.className = 'products-grid';
        renderGrid(grid, items);
        wrap.appendChild(grid);
      }
    }

    document.addEventListener('DOMContentLoaded', renderSoap);
  </script>
</body>
</html>
