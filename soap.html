<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мыло — Дами</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .section-label {
      font-family: 'Raleway', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #1a0a02;
      margin-bottom: 20px;
      max-width: 1100px;
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>
<body>

  <div class="page-hero">
    <div class="page-hero-title">Мыло</div>
    <div class="page-hero-sub">Натуральное мыло ручной работы из природных и растительных ингредиентов: масла, травы, глины, шоколад, пряности, водоросли, смолы, эфирные масла и т.д.</div>
  </div>

  <section class="section">

    <div class="filter-bar">
      <button class="filter-tab" data-sub="" onclick="selectSoapFolder(this)">Всё</button>
      <button class="filter-tab" data-sub="children" onclick="selectSoapFolder(this)">Детское</button>
      <button class="filter-tab" data-sub="household" onclick="selectSoapFolder(this)">Хозяйственное</button>
      <button class="filter-tab" data-sub="medicinal" onclick="selectSoapFolder(this)">Лечебное</button>
    </div>

    <div class="section-label" id="grid-label" style="display:none"></div>

    <div class="products-grid" id="products-grid"></div>

  </section>

  <script src="products.js"></script>
  <script src="nav.js"></script>
  <script src="app.js"></script>
</body>
</html>
